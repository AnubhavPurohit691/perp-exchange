[package]
name = "http-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros", "ws"] }
chrono = { version = "0.4.42", features = ["serde"] }
dashmap = "6.1.0"
dotenvy = "0.15"
futures-util = "0.3.31"
nanoid = "0.4.0"
rust_decimal = { version = "1.38.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tower = "0.5.2"
tower-http = { version = "0.6.7", features = ["cors"] }
jsonwebtoken="9"
argon2 = "0.5"
redis = { version = "1.0.3", features = ["tokio-comp"] }
deadpool-redis = "0.14"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono", "rust_decimal"] }
